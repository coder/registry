# SandboxTemplates for the scratch home of the kubernetes-agent-sandbox
# template: one per runtime. The warm pools in warm-pools.yaml boot Pods
# from them before anyone asks for a workspace.
#
# Replace these example values before you apply the file:
#   coder-workspaces                               your namespace
#   registry.example.com/coder/workspace:v2.30.0   your workspace_image
#   https://coder.example.com                      your Coder access URL
#   203.0.113.10/32 and port 443                   coder_egress_cidrs and coder_egress_port
#
# How a pooled Pod starts:
#   1. It boots and waits for the file /podinfo/token.
#   2. A workspace build creates a SandboxClaim. agent-sandbox hands it an
#      idle Pod and adds the claim's annotations to the Pod.
#   3. The downward API writes the coder.com/agent-token annotation to
#      /podinfo/token, usually within a second.
#   4. The Pod waits until a TCP connection to the Kubernetes API server
#      fails, which shows that its NetworkPolicy is in force, then starts
#      the Coder agent. Every 5 s it checks again. If the API server
#      becomes reachable, it stops the agent and the container exits.
#
# The token stays in plain text in the Pod annotation and the SandboxClaim,
# so only trusted users should read Pods and SandboxClaims here.
#
# Claimed Pods get only annotations, not the com.coder.workspace.id label:
# claim labels need a domain from the controller's allowed-label-domains
# setting.
#
# The NetworkPolicy below replaces the agent-sandbox default (public
# internet). It allows only the Coder server. The template allows only
# Fully isolated for a scratch home, because on Amazon VPC CNI the Pods of
# one pool on one node share their network rules.
#
# The Kata RuntimeClasses from kata-deploy have a scheduling.nodeSelector,
# so Kata Pods land on the Kata nodes without a nodeSelector here.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: coder-gvisor
  namespace: coder-workspaces
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    ingress: []
    egress:
      - to:
          - ipBlock:
              cidr: 203.0.113.10/32
        ports:
          - protocol: TCP
            port: 443
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: coder-workspace
        app.kubernetes.io/part-of: coder
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 2
      dnsPolicy: None
      dnsConfig:
        nameservers: ["8.8.8.8", "1.1.1.1"]
      # If the access URL uses a host name, Fully isolated cannot resolve
      # it. Map it to the Coder server IP:
      # hostAliases:
      #   - ip: 203.0.113.10
      #     hostnames: ["coder.example.com"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dev
          image: registry.example.com/coder/workspace:v2.30.0
          imagePullPolicy: IfNotPresent
          workingDir: /home/coder
          command:
            - sh
            - -c
            - |
              while [ ! -s /podinfo/token ]; do sleep 0.25; done
              [ -e /home/coder/.bashrc ] || cp -an /etc/skel/. /home/coder/ 2>/dev/null || true
              CODER_AGENT_TOKEN="$(cat /podinfo/token)"
              export CODER_AGENT_TOKEN
              export CODER_AGENT_AUTH=token
              export CODER_AGENT_URL=https://coder.example.com
              ulimit -n 65536 2>/dev/null || true
              # Start the agent only once a TCP connection to the API
              # server fails, then check again every 5 s. Must match
              # policy_check in main.tf.
              api="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT/"
              api_open() {
                r=$(curl -sk -o /dev/null --noproxy '*' --connect-timeout 0.3 -m 1 -w '%{http_code} %{time_connect}' "$api" 2>/dev/null)
                [ -z "$r" ] && return 0
                awk -v t="${r#* }" 'BEGIN { exit !(t + 0 > 0) }'
              }
              i=0
              while api_open; do
                i=$((i + 1))
                if [ "$i" -ge 240 ]; then echo "NetworkPolicy is not enforced" >&2; exit 1; fi
                sleep 0.25
              done
              echo "NetworkPolicy is in force after $i checks" >&2
              /usr/local/bin/coder agent &
              pid=$!
              trap 'kill -TERM "$pid" 2>/dev/null; wait "$pid"; exit 0' TERM INT
              while kill -0 "$pid" 2>/dev/null; do
                sleep 5 &
                wait $!
                if api_open; then echo "NetworkPolicy is no longer enforced" >&2; kill -KILL "$pid"; exit 1; fi
              done
              wait "$pid"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: home, mountPath: /home/coder }
            - { name: tmp, mountPath: /tmp }
            - { name: podinfo, mountPath: /podinfo, readOnly: true }
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: podinfo
          downwardAPI:
            items:
              - path: token
                fieldRef:
                  fieldPath: metadata.annotations['coder.com/agent-token']
---
