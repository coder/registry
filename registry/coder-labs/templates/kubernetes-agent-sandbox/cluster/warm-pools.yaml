# Warm pools for the scratch home of the kubernetes-agent-sandbox template,
# one for each SandboxTemplate. See README.md in this directory to size them.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: coder-gvisor
  namespace: coder-workspaces
spec:
  replicas: 1
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: coder-gvisor
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: coder-kata-qemu
  namespace: coder-workspaces
spec:
  replicas: 1
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: coder-kata-qemu
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: coder-kata-clh
  namespace: coder-workspaces
spec:
  replicas: 1
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: coder-kata-clh
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: coder-gvisor-github
  namespace: coder-workspaces
spec:
  replicas: 1
  updateStrategy:
    type: Recreate
  sandboxTemplateRef:
    name: coder-gvisor-github
