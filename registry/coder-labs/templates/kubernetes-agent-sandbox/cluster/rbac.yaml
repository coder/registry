# Namespace and permissions for the kubernetes-agent-sandbox template.
#
# The example namespace is coder-workspaces. To use another one, replace
# it in every file of this directory, for example:
#   sed -i 's/coder-workspaces/my-namespace/g' cluster/*.yaml
#
# The Role lets the Coder provisioner ServiceAccount (coder/coder, the
# default of the Coder Helm chart) manage workspaces in this namespace
# only. The cluster administrator applies the SandboxTemplates and
# SandboxWarmPools, so the Role does not need to write them.
apiVersion: v1
kind: Namespace
metadata:
  name: coder-workspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-agent-sandbox
  namespace: coder-workspaces
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # Read-only, to debug workspaces with kubectl as the provisioner.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-agent-sandbox
  namespace: coder-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-agent-sandbox
subjects:
  - kind: ServiceAccount
    name: coder
    namespace: coder
# The kubernetes_manifest resource of the hashicorp/kubernetes provider
# reads the CustomResourceDefinition of Sandbox and SandboxClaim at plan
# time. If a build fails with "customresourcedefinitions ... is forbidden",
# also grant cluster-wide read access to CRDs. CRDs are cluster-scoped, so
# a Role cannot grant it:
