# Namespace and permissions for the kubernetes-agent-sandbox template.
# See README.md in this directory for the values to replace.
apiVersion: v1
kind: Namespace
metadata:
  name: coder-workspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-agent-sandbox
  namespace: coder-workspaces
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # Read-only, to debug workspaces with kubectl as the provisioner.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-agent-sandbox
  namespace: coder-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-agent-sandbox
subjects:
  - kind: ServiceAccount
    name: coder
    namespace: coder
